[project]
name = "pyflow"
version = "0.1.0"
description = "A high-level Python DSL for composing and executing AI agent requests"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    "openhands-sdk>=1.14.0",
    "openhands-tools>=1.12.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
python_functions = ["test_*"]
python_classes = ["*Tests"]
# filterwarnings = [
#     "ignore:.*You should use `Logger` instead.*:DeprecationWarning",
#     "ignore:.*You should use `LoggerProvider` instead.*:DeprecationWarning",
#     "ignore:.*You should use `ProxyLoggerProvider` instead.*:DeprecationWarning",
# ]

[tool.hatch.build.targets.wheel]
packages = ["pyflow"]

[tool.pyright]
include = ["pyflow", "tests"]
exclude = [
    ".venv",
    "aux",
    "test.py",
    "examples",
    "pyflow-generated",
    "tests-generated",
    "secrets",
    "**/__pycache__",
    "**/node_modules",
    "**/.*",
]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
